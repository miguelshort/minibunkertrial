<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light dark;
  --r:20px;--sh1:0 1px 2px color-mix(in srgb,var(--shadow) 35%,transparent);--sh2:0 18px 40px -18px var(--shadow);
  --gold:var(--accent);--gold-hi:var(--accent-text);--gold-lo:var(--accent);--goldsoft:var(--accent-soft);--grad-gold:var(--accent);
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;--serif:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'Plus Jakarta Sans',system-ui,sans-serif;
}
html,body{min-height:100%;background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";
  background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--gold);color:var(--bg)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums lining-nums}
.label{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;height:38px;padding:0 1rem;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s ease;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--gold);color:var(--gold-hi);background:var(--surface2)}
.btn.primary{background:var(--grad-gold);border-color:transparent;color:var(--on-accent);font-weight:600;box-shadow:0 8px 22px -10px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.primary:hover{filter:brightness(1.07);color:var(--on-accent);box-shadow:0 10px 26px -10px color-mix(in srgb,var(--accent) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--goldsoft);border-color:transparent}
.btn.icon{width:38px;padding:0}
.btn.sm{height:32px;padding:0 .8rem;font-size:12.5px}
.btn.sm.icon{width:32px}
.btn:focus-visible,.ifield:focus-visible,.nav a:focus-visible,.chk:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ifield{width:100%;height:40px;border:1px solid var(--line2);border-radius:10px;background:var(--field);padding:0 .8rem;font-size:13.5px;transition:border-color .2s,box-shadow .2s}
.ifield::placeholder{color:var(--faint)}
.ifield:focus{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent);outline:none}
textarea.ifield{height:auto;padding:.65rem .8rem;resize:vertical;min-height:74px}
select.ifield{appearance:none;background:var(--field) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23d4b06a' stroke-width='1.5' fill='none'/></svg>") no-repeat right .9rem center;padding-right:2rem}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.8) sepia(.6) saturate(3) hue-rotate(5deg);opacity:.8}
.fl{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:.35rem}
.fl small{color:var(--faint);font-weight:400}

.chk{flex:none;width:18px;height:18px;border:1.5px solid var(--line2);border-radius:6px;background:transparent;cursor:pointer;position:relative;transition:all .2s;margin-top:1px}
.chk:hover{border-color:var(--gold)}
.chk[aria-checked=true]{background:var(--grad-gold);border-color:var(--gold)}
.chk[aria-checked=true]::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.done-t{text-decoration:line-through;color:var(--faint)}

/* categorías */
.sw{display:inline-block;flex:none;width:10px;height:10px;border-radius:3px;border:1px solid var(--gold);vertical-align:middle}
.c-personal{background:var(--gold)}
.c-trabajo{background:repeating-linear-gradient(45deg,var(--gold) 0 1.5px,transparent 1.5px 3.5px)}
.c-estudio{background:radial-gradient(var(--gold) .9px,transparent 1.2px) 0 0/3.5px 3.5px}
.c-ocio{background:transparent}
.c-importante{background:transparent;box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 5px var(--gold)}
.c-examen{background:var(--gold-hi);border-color:var(--gold-hi);border-radius:50%}

/* ---------- estructura ---------- */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--surface2),var(--surface2));border-right:1px solid var(--line);color:var(--ink2);padding:1.6rem 1.1rem;display:flex;flex-direction:column;gap:1.7rem;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:.7rem;padding:0 .4rem}
.mark{width:34px;height:34px;flex:none;border-radius:9px;display:flex;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 60%,transparent)}.mark svg{display:block;width:34px;height:34px}
.brand b{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.02em}
.today-card{border:1px solid var(--line2);border-radius:16px;padding:1.1rem 1.1rem 1rem;background:radial-gradient(140px 100px at 100% 0,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),linear-gradient(160deg,var(--surface),var(--surface));position:relative;overflow:hidden}
.today-card .d{font-family:var(--serif);font-size:3.2rem;font-weight:500;line-height:.95;letter-spacing:-.03em;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.today-card .w{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink);margin-top:.3rem;text-transform:capitalize}
.today-card .m{font-size:12px;color:var(--muted)}
.today-card .bar{height:3px;background:color-mix(in srgb,var(--accent) 15%,transparent);border-radius:3px;margin-top:1rem;overflow:hidden}
.today-card .bar i{display:block;height:100%;background:var(--grad-gold)}
.today-card .pct{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:.45rem}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .label{padding:0 .7rem .5rem;color:var(--faint)}
.nav a{display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer;transition:all .2s;position:relative}
.nav a:hover{background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--ink)}
.nav a[aria-current=page]{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent),color-mix(in srgb,var(--accent) 4%,transparent));color:var(--gold-hi)}
.nav a[aria-current=page]::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:2px;border-radius:2px;background:var(--grad-gold)}
.nav a svg{flex:none}
.nav a .ct{margin-left:auto;font-size:11px;font-family:var(--mono);opacity:.75}
.acct{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:.8rem .85rem;font-size:12px;background:var(--surface2)}
.acct .who{display:flex;align-items:center;gap:.6rem;min-width:0}
.acct .av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--grad-gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:13px;color:var(--on-accent)}
.acct .em{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:500}
.acct .st{display:flex;align-items:center;gap:.45rem;color:var(--muted);margin-top:.55rem;font-size:11.5px}
.acct .st::before{content:"";width:6px;height:6px;border-radius:50%;background:#7fd1a8;box-shadow:0 0 0 3px rgba(127,209,168,.15);flex:none}
.acct .st.busy::before{background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);animation:pulse 1s infinite}
.acct .st.off::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
@keyframes pulse{50%{opacity:.35}}

.main{min-width:0;padding:2.1rem 2.6rem 3rem}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.8rem;flex-wrap:wrap}
.topbar h1{font-family:var(--serif);font-size:2.3rem;font-weight:500;letter-spacing:-.02em;line-height:1.05;color:var(--ink)}
.topbar p{color:var(--muted);font-size:13.5px;margin-top:.4rem}
.topbar p::before{content:"";display:inline-block;width:18px;height:1px;background:var(--gold);vertical-align:middle;margin-right:.55rem}
.topbar .acts{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface2));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);backdrop-filter:blur(6px)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.card-h h3{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:-.005em;color:var(--ink)}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-b{padding:1.05rem 1.25rem}
.empty{color:var(--muted);font-size:13px;padding:.4rem 0;font-style:italic}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.mhead{display:none}

/* ---------- RESUMEN ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.1rem;margin-bottom:1.6rem}
.kpi{padding:1.1rem 1.25rem 1.05rem;position:relative;overflow:hidden}
.kpi .v{font-family:var(--serif);font-size:2.35rem;font-weight:500;letter-spacing:-.02em;line-height:1.05;margin-top:.45rem;color:var(--ink)}
.kpi .v small{font-family:var(--sans);font-size:.85rem;color:var(--muted);font-weight:500;letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted);margin-top:.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.accent{background:var(--grad-gold);border-color:transparent;color:var(--on-accent);box-shadow:0 16px 36px -18px color-mix(in srgb,var(--accent) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.kpi.accent::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;border:1px solid color-mix(in srgb,var(--on-accent) 15%,transparent)}
.kpi.accent .v{color:var(--on-accent)}
.kpi.accent .v small,.kpi.accent .s{color:color-mix(in srgb,var(--on-accent) 68%,transparent)}
.kpi.accent .label{color:color-mix(in srgb,var(--on-accent) 75%,transparent)}
.hoy{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1.5rem;align-items:start}
.col{display:flex;flex-direction:column;gap:1.5rem;min-width:0}
.sched{list-style:none}
.sched li{display:grid;grid-template-columns:76px 1fr;gap:1rem;padding:.8rem 0;border-top:1px solid var(--line)}
.sched li:first-child{border-top:none;padding-top:.2rem}
.sched .t{font-family:var(--mono);font-size:12.5px;color:var(--gold)}
.sched .t small{display:block;color:var(--faint);font-size:11px}
.sched .x{border-left:3px solid var(--line2);padding-left:.95rem;min-width:0}
.sched li.now .x{border-left-color:var(--gold)}
.sched .x b{display:flex;align-items:center;gap:.5rem;font-weight:600}
.sched .x small{display:block;color:var(--muted);font-size:12.5px;white-space:pre-wrap;margin-top:.1rem}
.sched .x .cat{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:auto;white-space:nowrap}
.nowtag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--grad-gold);color:var(--on-accent);border-radius:999px;padding:.08rem .5rem}
.up{list-style:none}
.up li{display:flex;gap:.9rem;align-items:center;padding:.6rem .5rem;margin:0 -.5rem;border-radius:10px;cursor:pointer;transition:background .2s}
.up li:hover{background:var(--goldsoft)}
.up li:focus-visible{outline:2px solid var(--gold)}
.dbox{flex:none;width:44px;text-align:center;border:1px solid var(--line2);border-radius:10px;padding:.3rem 0;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.dbox b{display:block;font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.05;color:var(--gold-hi)}
.dbox span{display:block;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.up .tt{font-weight:500;display:flex;align-items:center;gap:.45rem;min-width:0}
.up .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .ss{font-size:12px;color:var(--muted)}
.cdotsm{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.06)}
.tasks{list-style:none;display:flex;flex-direction:column}
.tasks li{display:flex;gap:.7rem;align-items:flex-start;padding:.6rem 0;border-top:1px solid var(--line)}
.tasks li:first-child{border-top:none;padding-top:0}
.tasks .from{display:block;font-size:11.5px;color:var(--muted)}

/* ---------- CALENDARIO ---------- */
.cal{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:1.5rem;align-items:start}
.month-h{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
.month-h h2{font-family:var(--serif);font-size:1.6rem;font-weight:500;letter-spacing:-.01em;text-transform:capitalize;color:var(--ink)}
.month-h h2 span{font-style:italic;color:var(--gold);font-weight:400;margin-left:.45rem}
.month-h .nv{display:flex;gap:.4rem}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{padding:.6rem .75rem;font-size:10.5px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.14em;border-bottom:1px solid var(--line)}
.day{min-height:116px;padding:.5rem .55rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:background .2s;min-width:0;position:relative;outline:none}
.day:nth-child(7n){border-right:none}
.grid .day:nth-last-child(-n+7){border-bottom:none}
.day:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.day.we{background:var(--surface2)}
.day.we:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.day.out .n{color:var(--faint)}
.day.out .chip{opacity:.5}
.day .n{font-family:var(--serif);font-size:15px;font-weight:500;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:2px;color:var(--ink2);flex:none}
.day.today .n{background:var(--grad-gold);color:var(--on-accent);font-weight:600;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--accent) 80%,transparent)}
.day.sel{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.day.sel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--gold);pointer-events:none}
.day.drop{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.day:focus-visible::after{content:"";position:absolute;inset:2px;outline:2px solid var(--gold);border-radius:6px}
.chip{display:flex;align-items:center;gap:.35rem;font-size:11.5px;line-height:1.3;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink);white-space:nowrap;overflow:hidden;min-width:0;cursor:grab;flex:none;transition:filter .15s,transform .15s}
.chip:hover{filter:brightness(1.12);transform:translateY(-1px)}
.chip .lab{overflow:hidden;text-overflow:ellipsis;font-weight:500}
.chip time{font-family:var(--mono);font-size:10.5px;opacity:.75;flex:none}
.chip .sw{width:8px;height:8px;border-color:currentColor}
.chip.imp{background:var(--grad-gold);border-color:transparent;color:var(--on-accent)}
.chip.ex{cursor:pointer;border-style:dashed;border-color:var(--gold);background:transparent;color:var(--gold-hi)}
.more{font-size:11px;color:var(--gold);padding-left:4px}
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;padding:.85rem 1.2rem;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:.45rem}
.legend .hint{margin-left:auto;color:var(--muted);font-style:italic}
.drawer{position:sticky;top:1.4rem}
.dh{display:flex;align-items:center;gap:.9rem;padding:1.1rem 1.25rem;border-bottom:1px solid var(--line)}
.dh .dn{font-family:var(--serif);font-size:2.9rem;font-weight:500;letter-spacing:-.03em;line-height:.9;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.dh .dw{font-family:var(--serif);font-style:italic;font-size:18px;text-transform:capitalize;color:var(--ink)}
.dh .dm{font-size:12px;color:var(--muted)}
.evl{list-style:none;padding:.5rem .7rem}
.evl li{display:flex;gap:.7rem;align-items:flex-start;padding:.65rem .5rem .65rem .75rem;border-radius:10px;border-left:3px solid transparent;transition:background .2s}
.evl li:hover{background:var(--goldsoft)}
.evl li.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.evl .ti{font-family:var(--mono);font-size:12px;min-width:3.1rem;color:var(--gold);padding-top:1px}
.evl .ti small{display:block;color:var(--faint);font-size:11px}
.evl .bd{flex:1;min-width:0}
.evl .bd b{display:flex;align-items:center;gap:.45rem;font-weight:600;word-break:break-word}
.evl .bd small{display:block;color:var(--muted);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.evl .meta{font-size:11.5px;color:var(--muted);margin-top:.15rem}
.evl .ac{display:flex;gap:2px;opacity:.65}
.evl li:hover .ac,.evl .ac:focus-within{opacity:1}
.evl .ac button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.evl .ac button:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--gold-hi)}
.evl .ac button:focus-visible{outline:2px solid var(--gold)}
.evl-empty{padding:1rem 1.25rem;color:var(--muted);font-size:13px;font-style:italic}
form.evf{display:flex;flex-direction:column;gap:.85rem;padding:1.1rem 1.25rem 1.25rem;border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 var(--r) var(--r)}
form.evf .row{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.cats{display:flex;flex-wrap:wrap;gap:.4rem}
.cats label{cursor:pointer;position:relative}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats label>span{display:inline-flex;align-items:center;gap:.4rem;height:30px;padding:0 .75rem;border:1px solid var(--line2);border-radius:999px;font-size:12px;font-weight:500;background:transparent;transition:all .2s;color:var(--ink2)}
.cats input:checked+span{border-color:var(--gold);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--gold-hi)}
.cats input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.colors{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cdot{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:transform .15s}
.cdot:hover{transform:scale(1.12)}
.cdot[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
.cdot:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.cdot.none{background:var(--surface2)}
.cdot.none::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:1.5px;background:var(--muted);transform:rotate(-45deg)}
.cdot.custom{background:conic-gradient(#ef4444,#eab308,#22c55e,#06b6d4,#3b82f6,#a855f7,#ec4899,#ef4444);overflow:hidden}
.cdot.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:none;padding:0}

/* ---------- NOTAS ---------- */
.ntools{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:1.3rem}
.ntools .l{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto}
.seg button{all:unset;cursor:pointer;height:30px;padding:0 .95rem;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;white-space:nowrap;transition:all .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--gold-hi);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.search{position:relative;width:270px}
.search input{padding-left:2.2rem;border-radius:999px}
.search svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--gold)}
.tagbar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.3rem}
.tg{all:unset;cursor:pointer;font-size:12px;font-weight:500;height:28px;padding:0 .7rem;border:1px solid var(--line2);border-radius:999px;background:transparent;display:inline-flex;align-items:center;gap:.4rem;color:var(--ink2);transition:all .2s}
.tg span{color:var(--muted);font-family:var(--mono);font-size:11px}
.tg:hover{border-color:var(--gold)}
.tg[aria-pressed=true]{background:var(--grad-gold);border-color:transparent;color:var(--on-accent)}
.tg[aria-pressed=true] span{color:color-mix(in srgb,var(--on-accent) 60%,transparent)}
.tg:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.1rem;align-items:start}
.note{display:flex;flex-direction:column;text-align:left;padding:1.15rem 1.25rem .9rem;cursor:pointer;transition:box-shadow .25s,border-color .25s,transform .25s;min-height:160px}
.note:hover{box-shadow:var(--sh2);transform:translateY(-3px)}
.note:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note.gray{background:linear-gradient(180deg,var(--surface2),var(--surface2));border-color:color-mix(in srgb,var(--accent) 18%,transparent)}
.note.light{background:linear-gradient(170deg,var(--accent-soft),var(--accent-soft));border-color:transparent;color:var(--ink)}
.note .top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
.note h4{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.01em;line-height:1.2;word-break:break-word}
.note h4.untitled{color:var(--faint);font-style:italic}
.note .pin{flex:none;color:var(--gold)}
.note .bx{font-size:13px;color:var(--ink2);white-space:pre-wrap;word-break:break-word;margin-bottom:.65rem;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.note ul{list-style:none;display:flex;flex-direction:column;gap:.38rem;margin-bottom:.65rem}
.note li{display:flex;gap:.55rem;align-items:flex-start;font-size:13px}
.prog{display:flex;align-items:center;gap:.6rem;margin-bottom:.65rem;font-size:11.5px;color:var(--muted)}
.prog .b{flex:1;height:3px;background:color-mix(in srgb,var(--accent) 15%,transparent);border-radius:3px;overflow:hidden}
.prog .b i{display:block;height:100%;background:var(--grad-gold)}
.tagl{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.6rem}
.tagl span{font-size:11px;font-weight:500;color:var(--gold-hi);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:999px;padding:.05rem .5rem}
.note .meta{margin-top:auto;padding-top:.65rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.note.light h4.untitled{color:var(--muted)}
.note.light .pin{color:var(--accent-text)}
.note.light .bx{color:var(--ink2)}
.note.light .prog{color:var(--muted)}.note.light .prog .b{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.note.light .tagl span{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-text)}
.note.light .meta{border-color:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--muted)}
.note.light .chk{border-color:var(--line2)}
.note.light .chk[aria-checked=true]{background:var(--ink);border-color:var(--ink)}
.note.light .chk[aria-checked=true]::after{border-color:var(--accent-text)}
.note.light .done-t{color:var(--muted)}
.newcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45rem;min-height:160px;border:1.5px dashed var(--line2);border-radius:var(--r);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .25s}
.newcard:hover{border-color:var(--gold);color:var(--gold-hi);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.newcard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- EXÁMENES ---------- */
.exg{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:1.5rem;align-items:start}
.subj{list-style:none}
.subj li{display:grid;grid-template-columns:minmax(0,1fr) 150px 70px;gap:1.1rem;align-items:center;padding:.8rem 0;border-top:1px solid var(--line);cursor:pointer}
.subj li:first-child{border-top:none;padding-top:.2rem}
.subj li:hover .nm{color:var(--gold-hi)}
.subj .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
.subj .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.gbar{position:relative;height:6px;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:6px}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--grad-gold)}
.gbar::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:color-mix(in srgb,var(--ink) 35%,transparent)}
.gbar.fail i{background:linear-gradient(90deg,#c26a5a,#e08f6f)}
.subj .av{font-family:var(--serif);font-size:1.55rem;font-weight:500;text-align:right;letter-spacing:-.02em;color:var(--ink)}
.chartw{padding:.7rem .5rem .3rem}
.chartw svg{display:block;width:100%;height:auto}
.chartw text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.xt{width:100%;border-collapse:collapse;font-size:13px}
.xt th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:.7rem 1.25rem;border-bottom:1px solid var(--line)}
.xt td{padding:.7rem 1.25rem;border-bottom:1px solid var(--line);vertical-align:middle}
.xt tr:last-child td{border-bottom:none}
.xt tr.on td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.xt tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.xt .d{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}
.xt .s{color:var(--muted);font-size:12.5px}
.xt .ac{display:flex;gap:2px;justify-content:flex-end}
.xt .ac button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.xt .ac button:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--gold-hi)}
.xt .ac button:focus-visible{outline:2px solid var(--gold)}
.gb{display:inline-flex;align-items:baseline;gap:.2rem;font-weight:600;font-size:13px;padding:.15rem .6rem;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.gb small{font-weight:400;font-size:11px;opacity:.7}
.gb.pass{background:var(--grad-gold);color:var(--on-accent)}
.gb.fail{background:rgba(224,143,111,.14);border:1px solid rgba(224,143,111,.55);color:var(--fail)}
.gb.pend{border:1px solid var(--line2);color:var(--muted);font-weight:500}
.grade-legend{display:flex;gap:1.1rem;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:.8rem 1.25rem;border-top:1px solid var(--line)}
.grade-legend span{display:flex;align-items:center;gap:.4rem}
.xcards{display:none}

/* ---------- modales ---------- */
.modal{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .box{width:100%;max-width:410px;padding:1.4rem;border-radius:18px;border-color:var(--line2);box-shadow:0 40px 80px -20px var(--shadow);animation:pop .22s ease;background:linear-gradient(180deg,var(--surface),var(--surface))}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.modal .box h4{font-family:var(--serif);font-size:20px;font-weight:500;margin-bottom:.35rem;color:var(--ink)}
.modal .box p{color:var(--muted);margin-bottom:1.25rem}
.modal .acts{display:flex;justify-content:flex-end;gap:.5rem}
.ed{max-width:700px!important;padding:0!important;max-height:calc(100vh - 2rem);display:flex;flex-direction:column;overflow:hidden}
.ed .edtop,.ed .edbot{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.75rem 1.1rem;flex-wrap:wrap}
.ed .edtop{border-bottom:1px solid var(--line)}
.ed .edbot{border-top:1px solid var(--line);background:var(--surface2)}
.ed .tones{display:flex;gap:.45rem;align-items:center}
.tone{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);cursor:pointer}
.tone[aria-pressed=true]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.tone.t-dark{background:var(--surface)}.tone.t-gray{background:var(--surface2)}.tone.t-light{background:var(--accent-soft);border-color:var(--accent-soft)}
.tone:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.ed .body{overflow:auto;padding:1.3rem 1.5rem}
.ed .tin{width:100%;border:none;background:transparent;font-family:var(--serif);font-size:1.9rem;font-weight:500;letter-spacing:-.015em;padding:0 0 .5rem;outline:none}
.ed .bin{width:100%;border:none;background:transparent;font-size:14.5px;line-height:1.75;resize:none;min-height:140px;outline:none;color:var(--ink2)}
.ed .tin::placeholder,.ed .bin::placeholder{color:var(--faint)}
.ed .sect{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}
.ed .items{list-style:none;display:flex;flex-direction:column;gap:.2rem;margin:.6rem 0 .3rem}
.ed .items li{display:flex;gap:.6rem;align-items:center;padding:.15rem 0}
.ed .items input{flex:1;border:none;background:transparent;padding:.3rem 0;outline:none;font-size:14px;border-bottom:1px solid transparent}
.ed .items input:focus{border-bottom-color:var(--line2)}
.ed .items .rm{all:unset;cursor:pointer;color:var(--faint);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.ed .items .rm:hover{background:var(--goldsoft);color:var(--gold-hi)}
.ed .additem{display:flex;gap:.6rem;align-items:center}
.ed .additem .plus{width:18px;text-align:center;color:var(--gold)}
.ed .additem input{flex:1;border:none;background:transparent;padding:.35rem 0;outline:none;font-size:14px}
.ed .additem input::placeholder{color:var(--faint)}
.ed .tagsin{border:1px solid var(--line2);border-radius:999px;height:34px;padding:0 .85rem;background:var(--field);outline:none;font-size:12.5px;min-width:200px;flex:1;max-width:320px}
.ed .tagsin:focus{border-color:var(--gold)}
.ed.gray .body{background:var(--surface2)}
.ed.light .body,.ed.light .edtop{background:var(--accent-soft);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 20%,transparent)}
.ed.light .bin{color:var(--ink2)}
.ed.light .tin::placeholder,.ed.light .bin::placeholder,.ed.light .additem input::placeholder{color:var(--muted)}
.ed.light .label{color:var(--accent-text)}
.ed.light .sect{border-color:color-mix(in srgb,var(--accent) 20%,transparent)}
.ed.light .chk{border-color:var(--line2)}
.ed.light .chk[aria-checked=true]{background:var(--ink);border-color:var(--ink)}
.ed.light .chk[aria-checked=true]::after{border-color:var(--accent-text)}
.ed.light .btn.ghost{color:var(--ink)}.ed.light .btn.ghost:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ed.light .items .rm:hover{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--ink)}
.ed.light .additem .plus{color:var(--accent-text)}
.ed.light .tone[aria-pressed=true]{box-shadow:0 0 0 2px var(--accent-soft),0 0 0 4px var(--accent-text)}

.toast{position:fixed;right:1.6rem;bottom:1.6rem;background:linear-gradient(180deg,var(--surface),var(--surface));color:var(--ink);border:1px solid var(--line2);border-radius:999px;padding:.65rem 1.1rem;font-size:13px;font-weight:500;box-shadow:0 16px 36px -12px var(--shadow);opacity:0;transform:translateY(8px);transition:all .25s;z-index:60;pointer-events:none;display:flex;align-items:center;gap:.55rem}
.toast::before{content:"";width:16px;height:16px;border-radius:50%;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><path d='M4.5 8.2l2.2 2.2 4.6-4.8' stroke='%231a1408' stroke-width='1.8' fill='none'/></svg>") center/16px no-repeat,var(--grad-gold)}
.toast.on{opacity:1;transform:none}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hoy,.cal,.exg{grid-template-columns:1fr}.drawer{position:static}}
/* ---------- MÓVIL ---------- */

  body{font-size:14.5px}

  .brand,.today-card,.acct,.nav .label{display:none}
  .nav{flex-direction:row;width:100%;gap:0}
  .nav a{flex:1;flex-direction:column;gap:.18rem;padding:.35rem .2rem;font-size:10.5px;justify-content:center;text-align:center;background:transparent!important}
  .nav a .ct{display:none}
  .nav a[aria-current=page]::before{display:none}
  .nav a[aria-current=page]{color:var(--gold-hi)}
  .nav a[aria-current=page] svg{background:var(--grad-gold);color:var(--on-accent);border-radius:999px;box-sizing:content-box;padding:4px 14px}
  .nav a svg{padding:4px 14px}
  .main{padding:.9rem .8rem calc(5.8rem + env(safe-area-inset-bottom))}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:1.1rem}
  .mhead .l{display:flex;align-items:center;gap:.6rem;font-family:var(--serif);font-size:19px;font-weight:600}
  .mhead .mark{width:30px;height:30px}.mhead .mark svg{width:30px;height:30px}
  .mhead .st{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:.4rem;max-width:58%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .mhead .st::before{content:"";width:6px;height:6px;border-radius:50%;background:#7fd1a8;flex:none}
  .mhead .st.busy::before{background:var(--gold)}
  .mhead .st.off::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
  .topbar{margin-bottom:1.1rem;align-items:center}
  .topbar h1{font-size:1.85rem}
  .kpis{gap:.7rem;margin-bottom:1.1rem}
  .kpi{padding:.9rem 1rem}.kpi .v{font-size:1.9rem}
  .hoy,.col{gap:1.1rem}
  .month-h{padding:.75rem .8rem}
  .month-h h2{font-size:1.35rem}
  .dow{padding:.5rem 0;text-align:center;font-size:10px;letter-spacing:.06em}
  .day{min-height:88px;padding:3px 2px;gap:2px;align-items:stretch}
  .day .n{font-size:13px;width:24px;height:24px;margin:0 auto 1px}
  .chip{font-size:9.5px;line-height:1.25;padding:1px 3px;border-radius:4px;gap:0;cursor:pointer}
  .chip time,.chip .sw{display:none}
  .chip .lab{text-overflow:clip}
  .more{font-size:9.5px;padding-left:2px;text-align:center}
  .legend{padding:.65rem .8rem;gap:.75rem;font-size:11px}
  .legend .hint{display:none}
  .search{width:100%}
  .ntools .l{width:100%}
  .xt-wrap{display:none}
  .xcards{display:block;list-style:none}
  .xcards li{display:flex;gap:.8rem;align-items:center;padding:.8rem 1.1rem;border-top:1px solid var(--line)}
  .xcards li:first-child{border-top:none}
  .xcards .i{flex:1;min-width:0}
  .xcards .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xcards .i small{display:block;color:var(--muted);font-size:12px}
  .subj li{grid-template-columns:minmax(0,1fr) 70px 52px;gap:.7rem}
  .toast{right:50%;transform:translate(50%,8px);bottom:calc(5.5rem + env(safe-area-inset-bottom))}
  .toast.on{transform:translate(50%,0)}
  .modal{align-items:flex-end;padding:0}
  .modal .box{border-radius:20px 20px 0 0;max-width:none}
  .ed{max-height:92vh}
}
/* ---------- formularios en hoja ---------- */
.sheet{max-width:460px!important;padding:0!important;max-height:calc(100vh - 2rem);display:flex;flex-direction:column;overflow:hidden}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.sh-h h4{margin:0!important}
.sh-b{overflow:auto;border-top:none!important;border-radius:0 0 18px 18px!important}
.sh-a{display:flex;gap:.5rem;margin-top:.3rem}
.ckl{display:flex;align-items:center;gap:.55rem;font-size:13px;color:var(--ink2);cursor:pointer}
.ckl input{accent-color:var(--gold);width:16px;height:16px}
/* ---------- HORARIO ---------- */
.tt{display:grid;grid-template-columns:58px repeat(var(--days),minmax(0,1fr))}
.tt-h{padding:.7rem .4rem .6rem;text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--line)}
.tt-h b{display:block;font-family:var(--serif);font-size:19px;letter-spacing:0;color:var(--ink);font-weight:500;margin-top:.1rem}
.tt-h.today{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tt-h.today b{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.tt-axis{position:relative;border-right:1px solid var(--line)}
.tt-axis span{position:absolute;right:9px;transform:translateY(-50%);font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.tt-axis span:first-child{transform:none}
.tt-col{position:relative;border-right:1px solid var(--line)}
.tt-col:last-child{border-right:none}
.tt-col.today{background:color-mix(in srgb,var(--accent) 3.5%,transparent)}
.tt-line{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--accent) 9%,transparent)}
.blk{position:absolute;left:5px;right:5px;border-radius:10px;padding:.42rem .55rem;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:var(--ink);transition:transform .15s,box-shadow .15s;outline:none}
.blk:hover{transform:translateY(-1px);box-shadow:0 12px 22px -12px var(--shadow)}
.blk:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.blk b{font-size:12.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk small{font-size:11px;color:var(--ink2);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk time{font-family:var(--mono);font-size:10.5px;color:var(--ink2);opacity:.75;margin-top:auto}
.blk.now{box-shadow:0 0 0 2px var(--gold),0 12px 26px -10px color-mix(in srgb,var(--accent) 60%,transparent)}
.brk{position:absolute;left:5px;right:5px;display:flex;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--grad-gold);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.ttmob{display:none}
.daysel{width:100%;display:flex}.daysel button{flex:1;justify-content:center}
.cls{list-style:none;display:flex;flex-direction:column;gap:.55rem}
.cls li{display:flex;gap:.85rem;align-items:stretch;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:.5rem;cursor:pointer;transition:border-color .2s}
.cls li:hover{border-color:var(--line2)}
.cls .tb{flex:none;width:62px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:500;gap:5px;padding:.4rem 0}
.cls .ci{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.1rem}
.cls .ci b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls .ci small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls li.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 24px -14px color-mix(in srgb,var(--accent) 60%,transparent)}
.cls li.brk{position:static;background:transparent;border:1px dashed var(--line);justify-content:center;color:var(--faint);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:.35rem;cursor:default}
.tagnow{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--grad-gold);color:var(--on-accent);border-radius:999px;padding:.05rem .45rem;margin-left:.5rem;vertical-align:2px}
.sl{list-style:none}
.sl li{display:flex;gap:.75rem;align-items:center;padding:.65rem 0;border-top:1px solid var(--line);cursor:pointer}

/* día del calendario */
.dsec{padding:.4rem 1.25rem .9rem;border-top:1px solid var(--line)}
.dsec .label{display:block;padding:.6rem 0 .35rem}
.mini{list-style:none}
.mini li{display:flex;align-items:center;gap:.6rem;padding:.32rem 0;font-size:13px;cursor:pointer}
.mini li:hover span:last-child{color:var(--gold-hi)}
.mini time{font-family:var(--mono);font-size:11.5px;color:var(--gold);width:2.8rem}
/* ---------- ESTUDIO ---------- */
.stg{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.5rem;align-items:start}
.pomo{display:flex;flex-direction:column;align-items:center;padding:1.5rem 1.25rem 1.3rem;gap:1.15rem}
.ring{position:relative;width:250px;height:250px;max-width:72vw;max-height:72vw}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 10px 30px color-mix(in srgb,var(--accent) 18%,transparent))}
.ring .tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tm b{font-family:var(--serif);font-size:4rem;font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.ring .tm span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:.55rem}

.pomo .ctl{display:flex;gap:.55rem;flex-wrap:wrap;justify-content:center}
.dots{display:flex;gap:7px}.dots i{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,transparent)}.dots i.on{background:var(--gold);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 60%,transparent)}

.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.7rem}
.row3 label{display:flex;flex-direction:column;gap:.3rem;font-size:11.5px}
.bigt{display:flex;align-items:baseline;gap:.6rem;margin-bottom:1rem}

/* =================== ESTILO AMABLE (tema configurable) =================== */
body{font-size:15px;letter-spacing:-.005em}
.num{font-variant-numeric:tabular-nums}
.label{color:var(--muted);letter-spacing:.08em;font-weight:700}
.empty{font-style:normal}
h1,h2,h3,h4,.topbar h1,.card-h h3,.month-h h2,.kpi .v,.today-card .d,.dh .dn,.subj .av,.bigt b,.ring .tm b,.ed .tin,.modal .box h4,.note h4,.dbox b,.tt-h b,.kbig>b{font-family:var(--sans)!important;font-style:normal!important}
.topbar{margin-bottom:1.4rem}
.topbar h1{font-size:2rem;font-weight:800;letter-spacing:-.025em}
.topbar p{margin-top:.25rem;font-weight:500}
.topbar p::before{display:none}
.card{background:var(--surface);border:1px solid var(--card-line);border-radius:22px;box-shadow:var(--sh1);backdrop-filter:none}
.card-h{border-bottom:none;padding:1.05rem 1.2rem .3rem}
.card-h h3{font-size:16.5px;font-weight:700}
.card-b{padding:.75rem 1.2rem 1.1rem}
.btn{border-radius:14px;background:var(--surface);border:1px solid var(--line2);font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:var(--fab-shadow);font-weight:700}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--accent-soft)}
.ifield{background:var(--field);border:1.5px solid var(--line2);border-radius:14px}
.ifield:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
select.ifield{background-image:none}
.seg{background:var(--surface2);border:none;border-radius:14px;padding:4px}
.seg button{border-radius:11px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--seg-shadow);font-weight:800}
.chk{border-color:var(--line2);border-radius:7px}
.chk[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.chk[aria-checked=true]::after{border-color:var(--on-accent)}
.sw{border-color:var(--accent-text)}
.c-personal{background:var(--accent)}
.c-trabajo{background:repeating-linear-gradient(45deg,var(--accent) 0 1.5px,transparent 1.5px 3.5px)}
.c-estudio{background:radial-gradient(var(--accent) .9px,transparent 1.2px) 0 0/3.5px 3.5px}
.c-importante{box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 5px var(--accent)}
.c-examen{background:var(--warm);border-color:var(--warm)}
.toast{background:var(--ink);color:var(--bg);border:none;border-radius:16px}
.toast::before{background-color:var(--accent)}
.modal{background:var(--scrim);backdrop-filter:blur(3px)}
.modal .box{background:var(--surface);border:none;border-radius:26px}
.sh-h{border-bottom:none;padding-bottom:.4rem}
.sh-b{background:transparent!important}
.sheet .sh-h h4{font-weight:800}
form.evf{background:transparent;border-top:none}
.more-opt{border-top:1px solid var(--line)}
.more-opt summary{color:var(--accent-text);font-weight:700}
.more-opt summary::before{border-color:var(--accent-text)}
.cats label>span{border-radius:12px;border:1.5px solid var(--line2);background:transparent}
.cats input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);box-shadow:none}
.cdot[aria-pressed=true]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}

/* chips rápidos */
.qchips{display:flex;gap:.5rem;flex-wrap:wrap}

      function bad(t){err.textContent=t;go.disabled=false;go.textContent=rs?"Enviar correo":mode==="in"?"Entrar":"Crear cuenta"}
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return bad("Escribe un correo electrónico válido.");
      if(rs){go.disabled=true;go.textContent="Enviando…";authCall("sendOobCode",{requestType:"PASSWORD_RESET",email:em}).then(function(){err.style.color="var(--accent-text)";bad("Listo. Revisa tu correo (mira también en spam).")}).catch(function(e){bad(e.message)});return}
      var pw=o.querySelector("#l-p").value;
      if(pw.length<6)return bad("La contraseña debe tener al menos 6 caracteres.");
      if(mode==="up"&&pw!==o.querySelector("#l-p2").value)return bad("Las contraseñas no coinciden.");
      go.disabled=true;go.textContent=mode==="up"?"Creando cuenta…":"Entrando…";err.textContent="";

      (mode==="up"?authCall("signUp",{email:em,password:pw,returnSecureToken:true}).then(function(j){if(nm)authCall("update",{idToken:j.idToken,displayName:nm,returnSecureToken:false}).catch(noop);return j})

        .then(function(j){setSes(sesFrom(j,nm));sessionStorage.removeItem(UI_KEY);location.reload()})
        .catch(function(e){bad(e.message)});
    };
  }
  draw();document.body.appendChild(o);
}

function deleteAccount(){ask("Eliminar cuenta","Se borrarán tu cuenta y todos sus datos en todos tus dispositivos: eventos, notas, horario, exámenes y hábitos. No se puede deshacer.","Eliminar todo",function(){
  toast("Eliminando cuenta…");
  Promise.all(PARTS.concat(["meta","prefs"]).map(function(p){return fsReq("DELETE","users/"+SES.uid+"/data/"+p).catch(noop)}))
    .then(function(){return getToken()}).then(function(t){return authCall("delete",{idToken:t})})
    .then(function(){clearLocal();location.reload()})
    .catch(function(e){toast(e&&e.code==="NET"?"Necesitas conexión a internet para eliminar la cuenta":"Vuelve a iniciar sesión y prueba otra vez")});
})}

/* ================= utilidades ================= */
function pad(n){return(n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function P(s){var p=String(s||"").split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addD(s,n){var d=P(s);d.setDate(d.getDate()+n);return iso(d)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function okColor(c){return /^#[0-9a-f]{6}$/i.test(c||"")?c.toLowerCase():""}
function textOn(c){var r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255;
  function f(x){return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)}return(.2126*f(r)+.7152*f(g)+.0722*f(b))>.32?"#000":"#fff"}
function fmtN(n){return n==null||isNaN(n)?"–":(Math.round(n*100)/100).toLocaleString("es-ES",{maximumFractionDigits:2})}
function noop(){}

function migEvents(a){return(a||[]).filter(function(e){return e&&e.date&&e.id!=="mwkhhkog3gqel"}).map(function(e){return{id:e.id||uid(),date:e.date,time:e.time||"",end:e.end||"",title:e.title||"",note:e.note||"",cat:e.cat||"personal",repeat:e.repeat||"none",color:okColor(e.color)}})}
function migNotes(a){return(a||[]).filter(function(n){return n&&n.id!=="mwjlzsdi0fk71"}).map(function(n){return{id:n.id||uid(),title:n.title||"",body:n.body||"",items:n.items||[],tone:n.tv?(n.tone||"dark"):(({white:"dark",dark:"light"})[n.tone]||n.tone||"dark"),tv:2,pinned:!!n.pinned,tags:n.tags||[],updated:n.updated||Date.now()}}).filter(function(n){return n.title||n.body||n.items.length})}
function migGrades(a){return(a||[]).map(function(g){return{id:g.id||uid(),subject:g.subject||"",title:g.title||"",date:g.date||"",time:g.time||"",score:(g.score===""||g.score==null||isNaN(+g.score))?null:+g.score,max:+g.max>0?+g.max:10,weight:(g.weight===""||g.weight==null||isNaN(+g.weight))?null:+g.weight,note:g.note||""}})}

function migSes(a){return(a||[]).filter(function(x){return x&&x.mins>0&&x.date}).map(function(x){return{id:x.id||uid(),subject:x.subject||"General",date:x.date,start:x.start||0,mins:+x.mins}})}

function migHab(a){return(a||[]).filter(function(x){return x&&x.name}).map(function(x){return{id:x.id||uid(),name:x.name,color:okColor(x.color)||"#d4b06a",days:(x.days&&typeof x.days==="object")?x.days:{},created:x.created||Date.now()}})}
function migSubj(a){return(a||[]).filter(function(x){return x&&x.name}).map(function(x){return{id:x.id||uid(),name:x.name,teacher:x.teacher||"",room:x.room||"",color:okColor(x.color)||"#6f9de0"}})}

    if(evs.length>show)inner+='<span class="more">+'+(evs.length-show)+(mobile?"":" más")+'</span>';
    cells+='<div class="'+cls+'" role="button" tabindex="0" data-d="'+k+'" aria-label="'+d.getDate()+' de '+MESES[d.getMonth()]+(evs.length?", "+evs.length+(evs.length===1?" cosa":" cosas"):"")+'">'+inner+'</div>';
  }

function noteCard(n){
  var tone=n.tone==="light"?" light":n.tone==="gray"?" gray":"";
  var done=n.items.filter(function(i){return i.done}).length;
  var items=n.items.slice(0,5).map(function(it){return '<li><span class="chk" role="checkbox" tabindex="0" aria-checked="'+!!it.done+'" data-n="'+n.id+'" data-i="'+it.id+'" aria-label="'+esc(it.t)+'"></span><span class="'+(it.done?"done-t":"")+'">'+esc(it.t)+'</span></li>'}).join("");
  return '<article class="note card'+tone+'" tabindex="0" data-open="'+n.id+'">'+
    '<div class="top"><h4 class="'+(n.title?"":"untitled")+'">'+esc(n.title||"Sin título")+'</h4>'+(n.pinned?'<span class="pin">'+ICON.pin+'</span>':"")+'</div>'+
    (n.body?'<div class="bx">'+esc(n.body)+'</div>':"")+
    (n.items.length?'<div class="prog"><span class="b"><i style="width:'+Math.round(done/n.items.length*100)+'%"></i></span><span class="num">'+done+'/'+n.items.length+'</span></div><ul>'+items+'</ul>'+(n.items.length>5?'<div class="prog" style="margin-top:-.3rem">y '+(n.items.length-5)+' más</div>':""):"")+
    (n.tags.length?'<div class="tagl">'+n.tags.map(function(t){return '<span>#'+esc(t)+'</span>'}).join("")+'</div>':"")+
    '<div class="meta"><span>Editada '+fmtTs(n.updated)+'</span></div></article>';
}

    '<div class="body"><input class="tin" id="e-t" placeholder="'+(asList&&!orig?"Nombre de la lista":"Título")+'" value="'+esc(d.title)+'" aria-label="Título"><textarea class="bin" id="e-b" placeholder="Escribe tu nota…" aria-label="Contenido">'+esc(d.body)+'</textarea>'+
    '<div class="sect"><span class="label">Tareas</span><ul class="items" id="e-items"></ul><div class="additem"><span class="plus">'+ICON.plus+'</span><input id="e-add" placeholder="Añadir tarea (Enter)" aria-label="Añadir tarea"></div></div></div>'+
    '<div class="edbot"><input class="tagsin" id="e-tags" placeholder="Etiquetas, separadas por comas" value="'+esc(d.tags.join(", "))+'" aria-label="Etiquetas">'+
    '<div style="display:flex;gap:.5rem">'+(orig?'<button class="btn" id="e-del">'+ICON.del+'Eliminar</button>':"")+'<button class="btn primary" id="e-ok">Guardar</button></div></div></div>';
  document.body.appendChild(m);

    ul.querySelectorAll(".chk").forEach(function(b){b.onclick=function(){var it=d.items[+b.dataset.i];it.done=!it.done;b.setAttribute("aria-checked",it.done);b.nextElementSibling.classList.toggle("done-t",it.done)}});
    ul.querySelectorAll("input").forEach(function(inp){inp.oninput=function(){d.items[+inp.dataset.i].t=inp.value};
      inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();m.querySelector("#e-add").focus()}if(e.key==="Backspace"&&!inp.value){e.preventDefault();d.items.splice(+inp.dataset.i,1);drawItems();m.querySelector("#e-add").focus()}}});
    ul.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){d.items.splice(+b.dataset.rm,1);drawItems()}});
  }
  drawItems();
  m.querySelector("#e-t").oninput=function(e){d.title=e.target.value};
  var ba=m.querySelector("#e-b");ba.oninput=function(){d.body=ba.value;grow()};
  function grow(){ba.style.height="auto";ba.style.height=Math.max(140,ba.scrollHeight)+"px"}grow();
  m.querySelector("#e-add").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();var t=e.target.value.trim();if(!t)return;d.items.push({id:uid(),t:t,done:false});e.target.value="";drawItems();e.target.focus()}};

    if(!commit||JSON.stringify(d)===before){if(cloud.pendingRender)softRender();return}
    var empty=!d.title.trim()&&!d.body.trim()&&!d.items.length;
    if(empty){if(orig){state.notes=state.notes.filter(function(n){return n.id!==orig.id});save("notes","Nota vacía eliminada")}rerender();return}

  if(!window.matchMedia("(max-width:760px)").matches||!orig)m.querySelector(orig?"#e-b":"#e-t").focus();
}

function chartSVG(list){
  var pts=list.filter(function(g){return g.score!=null}).sort(function(a,b){return(a.date||"").localeCompare(b.date||"")});
  if(pts.length<1)return '<p class="empty" style="padding:1rem 1.1rem">Cuando pongas notas verás aquí cómo evolucionan.</p>';
  var W=640,H=210,l=30,r=26,t=14,b=30,iw=W-l-r,ih=H-t-b;
  function X(i){return l+(pts.length===1?iw/2:i*iw/(pts.length-1))}function Y(v){return t+ih-(v/10)*ih}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución de tus notas"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4b06a" stop-opacity=".32"/><stop offset="1" stop-color="#d4b06a" stop-opacity="0"/></linearGradient><linearGradient id="cl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98c45"/><stop offset="1" stop-color="#f1d9a0"/></linearGradient></defs>';
  [0,2.5,5,7.5,10].forEach(function(v){s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="'+(v===5?"rgba(243,237,226,.35)":"rgba(212,176,106,.12)")+'"'+(v===5?' stroke-dasharray="4 4"':"")+'/><text x="'+(l-8)+'" y="'+(Y(v)+3.5)+'" text-anchor="end">'+(v%1?"":v)+'</text>'});
  var line=pts.map(function(g,i){return X(i)+","+Y(g10(g))}).join(" ");
  if(pts.length>1)s+='<polygon points="'+X(0)+','+Y(0)+' '+line+' '+X(pts.length-1)+','+Y(0)+'" fill="url(#cg)"/><polyline points="'+line+'" fill="none" stroke="url(#cl)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  var every=Math.ceil(pts.length/8);
  pts.forEach(function(g,i){var v=g10(g);s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="5" fill="'+(v>=5?"#f1d9a0":"#0b1220")+'" stroke="'+(v>=5?"#d4b06a":"#e08f6f")+'" stroke-width="2"><title>'+esc((g.subject||"")+" · "+(g.title||"")+": "+fmtN(g.score)+"/"+fmtN(g.max))+'</title></circle>';
    if(i%every===0)s+='<text x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle">'+(g.date?fmtD(g.date).slice(0,5):"–")+'</text>'});
  return s+'</svg>';
}

function genSlots(o){
  var t=toMin(o.start),out=[];
  for(var i=1;i<=o.n;i++){
    out.push({id:"s"+i,kind:"class",start:fmMin(t),end:fmMin(t+o.dur)});t+=o.dur;
    if(i<o.n&&o.b1>0&&i===o.b1a){out.push({id:"r1",kind:"break",start:fmMin(t),end:fmMin(t+o.b1)});t+=o.b1}
    if(i<o.n&&o.b2>0&&i===o.b2a){out.push({id:"r2",kind:"break",start:fmMin(t),end:fmMin(t+o.b2)});t+=o.b2}
  }
  return out;
}

try{var pp=JSON.parse(localStorage.getItem(POMO_KEY)||"null");if(pp){if(pp.dur)pomo.dur=pp.dur;if(pp.subject)pomo.subject=pp.subject}}catch(e){}

function pomoTotal(){return pomo.dur[pomo.mode]*60}

function pomoStart(){if(pomo.running)return;ensureAudio();if(pomo.left<=0)pomo.left=pomoTotal();pomo.running=true;pomo.endAt=Date.now()+pomo.left*1000;clearInterval(pomo.iv);pomo.iv=setInterval(pomoTick,250);pomoPaint()}
function pomoPause(){if(!pomo.running)return;pomo.left=Math.max(0,Math.round((pomo.endAt-Date.now())/1000));pomo.running=false;clearInterval(pomo.iv);pomoPaint()}

function pomoDone(){
  clearInterval(pomo.iv);pomo.running=false;chime();
  if(pomo.mode==="focus"){logSession(pomo.dur.focus);pomo.cycle++;pomo.mode=pomo.cycle%4===0?"long":"short";setTimeout(function(){toast("¡Bien hecho! Toca descansar")},1900)}
  else{pomo.mode="focus";toast("Descanso terminado: ¡a por otra!")}

  }

}

      '</div></section>'+
    '</div>'+
    '<div class="topbar" style="margin:2rem 0 1rem"><div><h1 style="font-size:1.6rem">Planes de estudio</h1><p>Reparte los temas de cada examen en los días que quedan</p></div></div>'+
    '<div class="plans">'+plansH+'</div>';
  pomoPaint();
  v.querySelectorAll("[data-pm]").forEach(function(b){b.onclick=function(){if(pomo.running&&!confirmSwitch())return;pomoSetMode(b.dataset.pm);renderEstudio()}});
  function confirmSwitch(){return true}
  document.getElementById("pomo-go").onclick=function(){pomo.running?pomoPause():pomoStart()};
  document.getElementById("pomo-rs").onclick=function(){pomoReset()};
  document.getElementById("pomo-fin").onclick=pomoFinish;
  var ps=document.getElementById("pomo-sub");ps.onchange=function(){pomo.subject=ps.value;pomoPrefs();ps.blur()};
  [["pd-f","focus"],["pd-s","short"],["pd-l","long"]].forEach(function(x){var el=document.getElementById(x[0]);el.onchange=function(){var n=Math.max(1,Math.min(180,Math.round(+el.value||pomo.dur[x[1]])));pomo.dur[x[1]]=n;el.value=n;pomoPrefs();if(!pomo.running&&pomo.mode===x[1]){pomo.left=pomoTotal();pomoPaint()}}});
  document.getElementById("addManual").onclick=function(){
    sheet("Añadir tiempo de estudio",'<div><label class="fl" for="m-s">Asignatura</label><select class="ifield" id="m-s">'+opts+'</select></div><div class="row"><div><label class="fl" for="m-m">Minutos</label><input class="ifield" type="number" id="m-m" min="1" max="600" value="30" required></div><div><label class="fl" for="m-d">Día</label><input class="ifield" type="date" id="m-d" value="'+TODAY+'" required></div></div>',
      {ok:"Añadir",onSave:function(m){var mins=Math.round(+m.querySelector("#m-m").value);if(!(mins>0))return false;state.sessions.push({id:uid(),subject:m.querySelector("#m-s").value||"General",date:m.querySelector("#m-d").value||TODAY,start:Date.now(),mins:mins});save("sessions","Tiempo añadido");renderEstudio()}});
  };
  bindPlans(v);
}
/* --- planes --- */
function planOf(gid){return state.plans.filter(function(p){return p.gid===gid}).sort(function(a,b){return a.date.localeCompare(b.date)})}
function shortDay(ds){if(ds===TODAY)return"Hoy";if(ds===addD(TODAY,1))return"Mañana";var d=P(ds);return DIAS[d.getDay()].slice(0,3)+" "+d.getDate()}
function planItemHTML(p,showSubj){
  var late=!p.done&&p.date<TODAY;
  return '<li class="'+(late?"late":"")+'"><button type="button" class="chk" role="checkbox" aria-checked="'+!!p.done+'" data-pl="'+p.id+'" aria-label="Hecho: '+esc(p.title)+'"></button><span class="pt"><span class="'+(p.done?"done-t":"")+'">'+esc(p.title)+'</span><small>'+(showSubj?'<span class="cdotsm" style="background:'+subjColor(p.subject)+';width:7px;height:7px;display:inline-block;margin-right:.35rem"></span>'+esc(p.subject)+" · ":"")+(late?'<b class="latetag">Atrasado · '+shortDay(p.date)+'</b>':shortDay(p.date))+'</small></span></li>';
}
function planCard(g){
  var items=planOf(g.id),done=items.filter(function(p){return p.done}).length,dl=Math.round((P(g.date)-P(TODAY))/864e5),col=subjColor(g.subject);
  return '<section class="card plan"><div class="card-h"><h3><span class="cdotsm" style="background:'+col+';display:inline-block;margin-right:.55rem"></span>'+esc(g.subject)+(g.title?' <span class="pl-t">· '+esc(g.title)+'</span>':"")+'</h3><span class="sub">'+fmtD(g.date)+' · '+(dl===0?"hoy":dl===1?"mañana":"en "+dl+" días")+'</span></div><div class="card-b">'+
    (items.length?'<div class="prog"><span class="b"><i style="width:'+Math.round(done/items.length*100)+'%"></i></span><span class="num">'+done+'/'+items.length+'</span></div><ul class="pl">'+items.map(function(p){return planItemHTML(p,false)}).join("")+'</ul><div class="pl-a"><button class="btn sm" data-mkplan="'+g.id+'">Rehacer plan</button><button class="btn sm ghost" data-rmplan="'+g.id+'">'+ICON.del+'Borrar plan</button></div>'
      :'<p class="empty" style="margin-bottom:.8rem">Aún no tiene plan.</p><button class="btn primary sm" data-mkplan="'+g.id+'">'+ICON.plus+'Crear plan de estudio</button>')+
  '</div></section>';
}
function bindPlans(root){
  root.querySelectorAll("[data-pl]").forEach(function(b){b.onclick=function(){var p=state.plans.find(function(x){return x.id===b.dataset.pl});if(!p)return;p.done=!p.done;save("plans",p.done?"¡Tema completado!":"");rerender()}});
  root.querySelectorAll("[data-mkplan]").forEach(function(b){b.onclick=function(){makePlan(b.dataset.mkplan)}});
  root.querySelectorAll("[data-rmplan]").forEach(function(b){b.onclick=function(){ask("Borrar plan","Se borrarán todas sus tareas de estudio.","Borrar",function(){state.plans=state.plans.filter(function(p){return p.gid!==b.dataset.rmplan});save("plans","Plan borrado");rerender()})}});
}
function makePlan(gid){
  var g=state.grades.find(function(x){return x.id===gid});if(!g)return;
  var prev=planOf(gid).filter(function(p){return !p.review}).map(function(p){return p.title}).join("\n");
  sheet("Plan para "+(g.subject||"el examen"),
    '<div><label class="fl" for="p-t">Temas o tareas <small>(uno por línea)</small></label><textarea class="ifield" id="p-t" rows="7" required placeholder="Tema 1 · Matrices&#10;Tema 2 · Determinantes&#10;Ejercicios del libro pág. 40">'+esc(prev)+'</textarea></div>'+
    '<div class="row"><div><label class="fl" for="p-s">Empezar el</label><input class="ifield" type="date" id="p-s" value="'+TODAY+'" required></div><div><label class="fl">Examen</label><input class="ifield" value="'+fmtD(g.date)+'" disabled></div></div>'+
    '<label class="ckl"><input type="checkbox" id="p-r" checked> Dejar el último día para un repaso general</label>',
    {ok:"Crear plan",onMount:function(m){m.querySelector("#p-t").focus()},
     onSave:function(m){
       var lines=m.querySelector("#p-t").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
       if(!lines.length){m.querySelector("#p-t").focus();return false}
       var st=m.querySelector("#p-s").value||TODAY,rev=m.querySelector("#p-r").checked,days=[];
       for(var d=st;d<g.date;d=addD(d,1))days.push(d);
       if(!days.length)days=[st<g.date?st:TODAY];
       var rd=null;if(rev&&days.length>=2)rd=days.pop();
       state.plans=state.plans.filter(function(p){return p.gid!==gid});
       lines.forEach(function(t,i){state.plans.push({id:uid(),gid:gid,subject:g.subject,title:t,date:days[Math.min(days.length-1,Math.floor(i*days.length/lines.length))],done:false})});
       if(rd)state.plans.push({id:uid(),gid:gid,subject:g.subject,title:"Repaso general",date:rd,done:false,review:true});
       save("plans","Plan creado: "+lines.length+(lines.length===1?" tema":" temas")+" en "+(days.length+(rd?1:0))+" días");rerender();
     }});
}

/* ================= CALCULADORA ================= */
function needed(subj,target){
  var list=state.grades.filter(function(g){return(g.subject||"Sin asignatura").trim()===subj});
  var gr=list.filter(function(g){return g.score!=null}),pe=list.filter(function(g){return g.score==null});
  if(!pe.length)return{none:true,cur:(subjects().find(function(s){return s.name===subj})||{}).avg};
  function w(g){return g.weight>0?g.weight:1}
  var Wg=0,Sg=0,Wp=0;gr.forEach(function(g){Wg+=w(g);Sg+=g10(g)*w(g)});pe.forEach(function(g){Wp+=w(g)});
  return{need:(target*(Wg+Wp)-Sg)/Wp,max:(Sg+10*Wp)/(Wg+Wp),pend:pe,W:Wg+Wp,w:w};
}
function calcHTML(){
  var subs=subjects().filter(function(s){return s.list.some(function(g){return g.score==null})}).map(function(s){return s.name});
  if(!ui.calcS||subs.indexOf(ui.calcS)<0)ui.calcS=subs[0]||"";
  return '<section class="card"><div class="card-h"><h3>¿Qué nota necesito?</h3><span class="sub">según tus notas y los pesos</span></div><div class="card-b">'+
    (subs.length?'<div class="calc"><div><label class="fl" for="k-s">Asignatura</label><select class="ifield" id="k-s">'+subs.map(function(s){return '<option'+(ui.calcS===s?" selected":"")+'>'+esc(s)+'</option>'}).join("")+'</select></div><div><label class="fl" for="k-t">Quiero sacar</label><input class="ifield" type="number" id="k-t" min="0" max="10" step="0.1" inputmode="decimal" value="'+(ui.calcT||5)+'"></div></div><div class="calc-r" id="k-r"></div>'
      :'<p class="empty">Añade exámenes pendientes (sin nota) para calcular qué necesitas sacar en ellos.</p>')+
  '</div></section>';
}
function bindCalc(root){
  var s=root.querySelector("#k-s"),t=root.querySelector("#k-t"),r=root.querySelector("#k-r");if(!s)return;
  function upd(){
    ui.calcS=s.value;ui.calcT=+String(t.value).replace(",",".")||0;keepUI();
    var x=needed(s.value,ui.calcT),T=fmtN(ui.calcT);
    if(x.none){r.innerHTML='<p class="empty">No tienes exámenes pendientes en esta asignatura.</p>';return}
    var lst=x.pend.map(function(g){return '<li>'+esc(g.title||"Examen")+' <small>'+fmtD(g.date)+' · cuenta un '+fmtN(x.w(g)/x.W*100)+' %</small></li>'}).join("");
    if(x.need<=0)r.innerHTML='<div class="kbig ok"><b>✓</b><div><strong>¡Ya lo tienes!</strong><span>Aunque sacaras un 0 llegarías a un '+T+'.</span></div></div>';
    else if(x.need>10)r.innerHTML='<div class="kbig bad"><b>!</b><div><strong>No es posible llegar a un '+T+'</strong><span>Sacando un 10 en todo llegarías a un '+fmtN(x.max)+'.</span></div></div>';
    else r.innerHTML='<div class="kbig"><b class="num">'+fmtN(Math.ceil(x.need*100)/100)+'</b><div><strong>Es la nota media que necesitas</strong><span>para terminar con un '+T+' en '+esc(s.value)+'</span></div></div><ul class="kl">'+lst+'</ul>';
  }
  s.onchange=upd;t.oninput=upd;upd();
}

/* ================= HÁBITOS ================= */
function streak(h){var d=TODAY;if(!h.days[d])d=addD(d,-1);var n=0;while(h.days[d]){n++;d=addD(d,-1)}return n}
function last30(h){var n=0;for(var i=0;i<30;i++)if(h.days[addD(TODAY,-i)])n++;return n}
function toggleHabit(id,d){var h=state.habits.find(function(x){return x.id===id});if(!h)return;if(h.days[d])delete h.days[d];else h.days[d]=1;save("habits",h.days[d]&&d===TODAY?"¡Hecho! Racha de "+streak(h)+(streak(h)===1?" día":" días"):"");rerender()}
function habitTodayHTML(){
  if(!state.habits.length)return '<p class="empty">Aún no tienes hábitos. Pulsa «+» y elige «Hábito».</p>';
  return '<ul class="htd">'+state.habits.map(function(h){var on=!!h.days[TODAY],st=streak(h);return '<li><button class="hchk'+(on?" on":"")+'" data-htog="'+h.id+'" aria-pressed="'+on+'" aria-label="'+esc(h.name)+'" style="--hc:'+h.color+'"></button><span class="'+(on?"done-t":"")+'">'+esc(h.name)+'</span><small class="num">'+(st?st+(st===1?" día":" días"):"")+'</small></li>'}).join("")+'</ul>';
}
function bindHabits(root){root.querySelectorAll("[data-htog]").forEach(function(b){b.onclick=function(){toggleHabit(b.dataset.htog,b.dataset.d||TODAY)}})}
function renderHabitos(){
  var v=document.getElementById("view");
  var doneT=state.habits.filter(function(h){return h.days[TODAY]}).length;
  var days=[];for(var i=13;i>=0;i--)days.push(addD(TODAY,-i));
  var best=state.habits.reduce(function(a,h){return Math.max(a,streak(h))},0);
  v.innerHTML=topbar("Hábitos",state.habits.length?doneT+" de "+state.habits.length+" hechos hoy":"Pequeñas rutinas que suman cada día",'')+
    '<form class="card hadd" id="hForm" autocomplete="off"><input class="ifield" id="h-n" maxlength="50" placeholder="Nuevo hábito… ej. Leer 20 minutos, Repasar inglés, Deporte" aria-label="Nuevo hábito"><button class="btn primary" type="submit">'+ICON.plus+'Añadir</button></form>'+
    (state.habits.length?'<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card kpi accent"><div class="label">Hoy</div><div class="v num">'+doneT+'<small> /'+state.habits.length+'</small></div><div class="s">hábitos completados</div></div><div class="card kpi"><div class="label">Mejor racha actual</div><div class="v num">'+best+'</div><div class="s">días seguidos</div></div><div class="card kpi"><div class="label">Últimos 30 días</div><div class="v num">'+Math.round(state.habits.reduce(function(a,h){return a+last30(h)},0)/(state.habits.length*30)*100)+'<small> %</small></div><div class="s">de cumplimiento</div></div></div>':"")+
    '<section class="card"><div class="card-h"><h3>Tus hábitos</h3><span class="sub">toca un día para marcarlo</span></div><div class="card-b" style="padding-top:.3rem;padding-bottom:.3rem">'+
    (state.habits.length?'<ul class="hab">'+state.habits.map(function(h){var st=streak(h),on=!!h.days[TODAY];
      return '<li><div class="hi"><span class="cdotsm" style="background:'+h.color+';width:11px;height:11px"></span><div><b>'+esc(h.name)+'</b><small>'+(st?"Racha de "+st+(st===1?" día":" días"):"Sin racha")+' · '+last30(h)+'/30 días</small></div><button class="hdel" data-hdel="'+h.id+'" aria-label="Eliminar hábito" title="Eliminar">'+ICON.del+'</button></div>'+
        '<div class="hdays">'+days.map(function(d){var dd=P(d),o=!!h.days[d];return '<button class="hd'+(o?" on":"")+(d===TODAY?" t":"")+'" data-htog="'+h.id+'" data-d="'+d+'" aria-pressed="'+o+'" title="'+cap(DIAS[dd.getDay()])+' '+dd.getDate()+'" style="--hc:'+h.color+'"><span>'+DIAS[dd.getDay()].slice(0,1).toUpperCase()+'</span></button>'}).join("")+'</div>'+
        '<button class="hchk big'+(on?" on":"")+'" data-htog="'+h.id+'" aria-pressed="'+on+'" aria-label="Hecho hoy: '+esc(h.name)+'" style="--hc:'+h.color+'"></button></li>'}).join("")+'</ul>'
     :'<p class="empty">Aún no tienes hábitos. Escribe uno arriba para empezar.</p>')+
    '</div></section>';
  document.getElementById("hForm").onsubmit=function(e){e.preventDefault();var i=document.getElementById("h-n"),n=i.value.trim();if(!n)return;
    state.habits.push({id:uid(),name:n,color:PALETTE[(state.habits.length+2)%PALETTE.length],days:{},created:Date.now()});i.value="";i.blur();save("habits","Hábito creado");renderHabitos()};
  v.querySelectorAll("[data-hdel]").forEach(function(b){b.onclick=function(){ask("Eliminar hábito","Se perderá su historial.","Eliminar",function(){state.habits=state.habits.filter(function(h){return h.id!==b.dataset.hdel});save("habits","Hábito eliminado");renderHabitos()})}});
  bindHabits(v);
}

function dayExtras(ds){
  var c=classesOn(ds),pl=state.plans.filter(function(p){return p.date===ds}),h="";
  if(pl.length)h+='<div class="dsec"><span class="label">Estudio</span><ul class="pl">'+pl.map(function(p){return planItemHTML(p,true)}).join("")+'</ul></div>';
  if(c.length)h+='<div class="dsec"><span class="label">Clases</span><ul class="mini">'+c.map(function(x){return '<li data-cls="'+x.id+'" tabindex="0"><time>'+esc(x.start)+'</time><span class="cdotsm" style="background:'+x.color+'"></span><span>'+esc(x.subject)+'</span></li>'}).join("")+'</ul></div>';
  return h;
}
window.addEventListener("hashchange",function(){var t=location.hash.slice(1);if(TABS.indexOf(t)>-1&&t!==ui.tab){ui.tab=t;render()}});
var lastMobile=window.matchMedia("(max-width:760px)").matches;
window.addEventListener("resize",function(){var m=window.matchMedia("(max-width:760px)").matches;if(m!==lastMobile){lastMobile=m;if(!typing()&&!document.querySelector(".modal"))rerender()}});
render();
initCloud();
if(LOCAL_MODE)paintAccount();
if(LOCAL_MODE&&!LUSER)showLogin();
})();
</script>
</body>
